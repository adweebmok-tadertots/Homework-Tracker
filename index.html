<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DueFlow — Homework & Task Tracker</title>

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            surface: {
              950: '#0b0c10',
              900: '#111318',
              850: '#161922',
              800: '#1c202b',
              700: '#272c3a',
            }
          }
        }
      }
    };
  </script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; }
    .dark color-scheme, .dark input[type="date"], .dark input[type="time"] { color-scheme: dark; }
    .task-enter { animation: fadeSlideIn 0.2s ease-out; }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.45); }
  </style>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-surface-950 dark:text-slate-100 transition-colors duration-200">
  <!-- Header -->
  <header class="sticky top-0 z-30 border-b border-slate-200/80 dark:border-white/5 bg-white/80 dark:bg-surface-950/80 backdrop-blur-md">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-indigo-500/15 border border-indigo-500/30 flex items-center justify-center text-indigo-500 dark:text-indigo-400 shrink-0 shadow-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <div class="truncate">
          <h1 class="text-base font-bold tracking-tight leading-tight">DueFlow</h1>
          <p class="text-[11px] text-slate-500 dark:text-slate-400 leading-tight">Homework &amp; Assignment Tracker</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- Saved Locally Badge -->
        <div title="Tasks & courses are saved permanently in this browser" class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>Saved Locally</span>
        </div>

        <!-- Backup Button -->
        <button id="openBackupBtn" type="button" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 hover:bg-slate-200 dark:bg-surface-800 dark:hover:bg-surface-700 border border-slate-200 dark:border-white/10 transition">
          <svg class="w-3.5 h-3.5 text-slate-500 dark:text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
          </svg>
          <span>Backup</span>
        </button>

        <!-- Courses Button -->
        <button id="openCoursesBtn" type="button" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 hover:bg-slate-200 dark:bg-surface-800 dark:hover:bg-surface-700 border border-slate-200 dark:border-white/10 transition">
          <svg class="w-3.5 h-3.5 text-indigo-500 dark:text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 003 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 005.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 009.568 3z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 6h.008v.008H6V6z" />
          </svg>
          <span>Courses</span>
        </button>

        <!-- Theme Toggle -->
        <button id="themeToggleBtn" type="button" title="Toggle light/dark mode" class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-surface-800 dark:hover:bg-surface-700 border border-slate-200 dark:border-white/10 text-slate-600 dark:text-slate-300 transition">
          <svg id="sunIcon" class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
          </svg>
          <svg id="moonIcon" class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 space-y-6">
    <!-- Stat Cards -->
    <section class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
      <button type="button" data-stat-filter="today" class="text-left p-4 rounded-2xl bg-white dark:bg-surface-900 border border-slate-200 dark:border-white/5 hover:border-amber-500/40 transition group">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-medium text-slate-500 dark:text-slate-400">Due Today</span>
          <span class="w-7 h-7 rounded-lg bg-amber-500/10 text-amber-500 flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </span>
        </div>
        <div id="statToday" class="text-2xl font-bold tracking-tight">0</div>
        <div class="text-[11px] text-slate-500 dark:text-slate-500 mt-0.5">Focus for today</div>
      </button>

      <button type="button" data-stat-filter="upcoming" class="text-left p-4 rounded-2xl bg-white dark:bg-surface-900 border border-slate-200 dark:border-white/5 hover:border-indigo-500/40 transition group">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-medium text-slate-500 dark:text-slate-400">Upcoming (7d)</span>
          <span class="w-7 h-7 rounded-lg bg-indigo-500/10 text-indigo-500 flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5"/></svg>
          </span>
        </div>
        <div id="statUpcoming" class="text-2xl font-bold tracking-tight">0</div>
        <div class="text-[11px] text-slate-500 dark:text-slate-500 mt-0.5">Next 7 days</div>
      </button>

      <button type="button" data-stat-filter="overdue" class="text-left p-4 rounded-2xl bg-white dark:bg-surface-900 border border-slate-200 dark:border-white/5 hover:border-rose-500/40 transition group">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-medium text-slate-500 dark:text-slate-400">Overdue</span>
          <span class="w-7 h-7 rounded-lg bg-rose-500/10 text-rose-500 flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
          </span>
        </div>
        <div id="statOverdue" class="text-2xl font-bold tracking-tight text-rose-500">0</div>
        <div class="text-[11px] text-slate-500 dark:text-slate-500 mt-0.5">Needs attention</div>
      </button>

      <button type="button" data-stat-filter="completed" class="text-left p-4 rounded-2xl bg-white dark:bg-surface-900 border border-slate-200 dark:border-white/5 hover:border-emerald-500/40 transition group">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-medium text-slate-500 dark:text-slate-400">Completed</span>
          <span class="w-7 h-7 rounded-lg bg-emerald-500/10 text-emerald-500 flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
          </span>
        </div>
        <div id="statCompleted" class="text-2xl font-bold tracking-tight text-emerald-500">0</div>
        <div class="text-[11px] text-slate-500 dark:text-slate-500 mt-0.5">Finished work</div>
      </button>
    </section>

    <!-- Quick-Add Form -->
    <section class="p-4 sm:p-5 rounded-2xl bg-white dark:bg-surface-900 border border-slate-200 dark:border-white/5 shadow-sm">
      <form id="addTaskForm" class="space-y-4">
        <div class="flex flex-col sm:flex-row gap-3">
          <input
            id="taskTitleInput"
            type="text"
            required
            placeholder="Add homework or task (e.g., Practice Problem Set 4)..."
            class="flex-1 px-4 py-3 rounded-xl text-sm bg-slate-50 dark:bg-surface-950 border border-slate-200 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 placeholder:text-slate-400 dark:placeholder:text-slate-500"
          />
          <button
            type="submit"
            class="px-5 py-3 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] transition shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-1.5 shrink-0"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
            <span>Add Task</span>
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
          <!-- Course -->
          <div>
            <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Course / Tag</label>
            <div class="flex gap-1.5">
              <select id="taskCourseInput" class="flex-1 min-w-0 px-3 py-2 rounded-xl text-sm bg-slate-50 dark:bg-surface-950 border border-slate-200 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50"></select>
              <button id="quickAddCourseBtn" type="button" title="Add or manage courses" class="px-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-surface-800 dark:hover:bg-surface-700 border border-slate-200 dark:border-white/10 text-slate-600 dark:text-slate-300 transition">+</button>
            </div>
          </div>

          <!-- Due Date -->
          <div>
            <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Due Date</label>
            <input id="taskDateInput" type="date" required class="w-full px-3 py-2 rounded-xl text-sm bg-slate-50 dark:bg-surface-950 border border-slate-200 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50" />
          </div>

          <!-- Time -->
          <div>
            <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Time <span class="normal-case font-normal opacity-70">(optional)</span></label>
            <input id="taskTimeInput" type="time" class="w-full px-3 py-2 rounded-xl text-sm bg-slate-50 dark:bg-surface-950 border border-slate-200 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50" />
          </div>

          <!-- Priority -->
          <div>
            <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Priority</label>
            <div class="grid grid-cols-3 p-1 rounded-xl bg-slate-100 dark:bg-surface-950 border border-slate-200 dark:border-white/10">
              <button type="button" data-priority="low" class="priority-btn py-1.5 rounded-lg text-xs font-medium transition">Low</button>
              <button type="button" data-priority="medium" class="priority-btn py-1.5 rounded-lg text-xs font-medium transition">Med</button>
              <button type="button" data-priority="high" class="priority-btn py-1.5 rounded-lg text-xs font-medium transition">High</button>
            </div>
          </div>
        </div>

        <!-- Expandable Notes -->
        <div>
          <button id="toggleNotesBtn" type="button" class="inline-flex items-center gap-1.5 text-xs font-medium text-indigo-600 dark:text-indigo-400 hover:underline">
            <svg id="notesChevron" class="w-3.5 h-3.5 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
            <span>Add homework details, links, or submission notes</span>
          </button>
          <div id="notesDrawer" class="hidden mt-2.5">
            <textarea
              id="taskNotesInput"
              rows="2"
              placeholder="Paste Canvas/Blackboard links, textbook pages, or instructions..."
              class="w-full px-3.5 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-surface-950 border border-slate-200 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 placeholder:text-slate-400 dark:placeholder:text-slate-500 resize-y"
            ></textarea>
          </div>
        </div>
      </form>
    </section>

    <!-- Filter & Search Controls -->
    <section class="space-y-3">
      <div class="flex flex-wrap items-center gap-2" id="filterTabs">
        <button type="button" data-filter="active" class="filter-tab px-3.5 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
          <span>All Active</span><span class="tab-count px-1.5 py-0.5 rounded-md text-[10px]">0</span>
        </button>
        <button type="button" data-filter="today" class="filter-tab px-3.5 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
          <span>Due Today</span><span class="tab-count px-1.5 py-0.5 rounded-md text-[10px]">0</span>
        </button>
        <button type="button" data-filter="upcoming" class="filter-tab px-3.5 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
          <span>Upcoming</span><span class="tab-count px-1.5 py-0.5 rounded-md text-[10px]">0</span>
        </button>
        <button type="button" data-filter="overdue" class="filter-tab px-3.5 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
          <span>Overdue</span><span class="tab-count px-1.5 py-0.5 rounded-md text-[10px]">0</span>
        </button>
        <button type="button" data-filter="completed" class="filter-tab px-3.5 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
          <span>Completed</span><span class="tab-count px-1.5 py-0.5 rounded-md text-[10px]">0</span>
        </button>
      </div>

      <div class="flex flex-col sm:flex-row gap-2.5">
        <div class="relative flex-1">
          <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
          </svg>
          <input
            id="searchInput"
            type="text"
            placeholder="Search assignments, courses, or notes... (press /)"
            class="w-full pl-10 pr-4 py-2 rounded-xl text-sm bg-white dark:bg-surface-900 border border-slate-200 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 placeholder:text-slate-400 dark:placeholder:text-slate-500"
          />
        </div>

        <select id="courseFilterSelect" class="px-3.5 py-2 rounded-xl text-sm bg-white dark:bg-surface-900 border border-slate-200 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
          <option value="all">All Courses</option>
        </select>

        <select id="sortSelect" class="px-3.5 py-2 rounded-xl text-sm bg-white dark:bg-surface-900 border border-slate-200 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
          <option value="dueAsc">Sort: Due Soonest</option>
          <option value="priorityDesc">Sort: Highest Priority</option>
          <option value="newest">Sort: Recently Added</option>
        </select>
      </div>
    </section>

    <!-- Task List -->
    <section id="taskList" class="space-y-2.5 pb-12"></section>
  </main>

  <!-- Edit Task Modal -->
  <div id="editModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="w-full max-w-lg rounded-2xl bg-white dark:bg-surface-900 border border-slate-200 dark:border-white/10 shadow-2xl overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-200 dark:border-white/10 flex items-center justify-between">
        <h2 class="text-base font-bold">Edit Assignment</h2>
        <button type="button" data-close-modal="editModal" class="p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-surface-800 text-slate-400">✕</button>
      </div>
      <form id="editTaskForm" class="p-5 space-y-4">
        <input type="hidden" id="editTaskId" />
        <div>
          <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Title</label>
          <input id="editTitleInput" type="text" required class="w-full px-3.5 py-2 rounded-xl text-sm bg-slate-50 dark:bg-surface-950 border border-slate-200 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50" />
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Course / Tag</label>
            <select id="editCourseInput" class="w-full px-3 py-2 rounded-xl text-sm bg-slate-50 dark:bg-surface-950 border border-slate-200 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50"></select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Priority</label>
            <select id="editPriorityInput" class="w-full px-3 py-2 rounded-xl text-sm bg-slate-50 dark:bg-surface-950 border border-slate-200 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Due Date</label>
            <input id="editDateInput" type="date" required class="w-full px-3 py-2 rounded-xl text-sm bg-slate-50 dark:bg-surface-950 border border-slate-200 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Time (optional)</label>
            <input id="editTimeInput" type="time" class="w-full px-3 py-2 rounded-xl text-sm bg-slate-50 dark:bg-surface-950 border border-slate-200 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Notes</label>
          <textarea id="editNotesInput" rows="3" class="w-full px-3.5 py-2 rounded-xl text-sm bg-slate-50 dark:bg-surface-950 border border-slate-200 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 resize-y"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" data-close-modal="editModal" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-100 hover:bg-slate-200 dark:bg-surface-800 dark:hover:bg-surface-700">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Courses Manager Modal -->
  <div id="coursesModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="w-full max-w-md rounded-2xl bg-white dark:bg-surface-900 border border-slate-200 dark:border-white/10 shadow-2xl overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-200 dark:border-white/10 flex items-center justify-between">
        <h2 class="text-base font-bold">Manage Courses &amp; Tags</h2>
        <button type="button" data-close-modal="coursesModal" class="p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-surface-800 text-slate-400">✕</button>
      </div>
      <div class="p-5 space-y-4">
        <form id="addCourseForm" class="space-y-3">
          <div class="flex gap-2">
            <input id="newCourseNameInput" type="text" required placeholder="e.g., FIN 325, BIA 261, ACC 315..." class="flex-1 px-3.5 py-2 rounded-xl text-sm bg-slate-50 dark:bg-surface-950 border border-slate-200 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50" />
            <button type="submit" class="px-4 py-2 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500">Add</button>
          </div>
          <div class="flex items-center gap-2 flex-wrap" id="courseColorPicker"></div>
        </form>
        <div id="courseList" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
      </div>
    </div>
  </div>

  <!-- Backup & Restore Modal -->
  <div id="backupModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="w-full max-w-md rounded-2xl bg-white dark:bg-surface-900 border border-slate-200 dark:border-white/10 shadow-2xl overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-200 dark:border-white/10 flex items-center justify-between">
        <h2 class="text-base font-bold">Backup &amp; Restore</h2>
        <button type="button" data-close-modal="backupModal" class="p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-surface-800 text-slate-400">✕</button>
      </div>
      <div class="p-5 space-y-5">
        <div class="p-4 rounded-xl bg-slate-50 dark:bg-surface-950 border border-slate-200 dark:border-white/10 space-y-2.5">
          <div class="text-sm font-semibold">Export Backup</div>
          <p class="text-xs text-slate-500 dark:text-slate-400">Download all your tasks and custom courses as a JSON file so you can move them to another browser or keep a safe copy.</p>
          <button id="exportJsonBtn" type="button" class="w-full py-2.5 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 transition">
            Download Backup (.json)
          </button>
        </div>

        <div class="p-4 rounded-xl bg-slate-50 dark:bg-surface-950 border border-slate-200 dark:border-white/10 space-y-3">
          <div class="text-sm font-semibold">Import Backup</div>
          <div class="flex items-center gap-4 text-xs">
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="radio" name="importMode" value="merge" checked class="accent-indigo-600" />
              <span>Merge with existing</span>
            </label>
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="radio" name="importMode" value="replace" class="accent-indigo-600" />
              <span>Replace all data</span>
            </label>
          </div>
          <input id="importFileInput" type="file" accept=".json,application/json" class="hidden" />
          <button id="importJsonBtn" type="button" class="w-full py-2.5 rounded-xl text-sm font-semibold bg-slate-200 hover:bg-slate-300 dark:bg-surface-800 dark:hover:bg-surface-700 transition">
            Choose Backup File (.json)
          </button>
          <p id="importStatus" class="text-xs hidden"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden px-4 py-2.5 rounded-xl text-xs font-semibold text-white bg-slate-900 dark:bg-indigo-600 shadow-xl"></div>

  <script>
    // ---------- Storage Keys & Defaults ----------
    const STORAGE_KEYS = {
      tasks: 'dueflow_tasks_v1',
      courses: 'dueflow_courses_v1',
      theme: 'dueflow_theme_v1'
    };

    const COLOR_PALETTE = [
      { id: 'indigo', dot: 'bg-indigo-500', badge: 'bg-indigo-500/15 text-indigo-600 dark:text-indigo-300 border-indigo-500/25' },
      { id: 'emerald', dot: 'bg-emerald-500', badge: 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-300 border-emerald-500/25' },
      { id: 'amber', dot: 'bg-amber-500', badge: 'bg-amber-500/15 text-amber-600 dark:text-amber-300 border-amber-500/25' },
      { id: 'rose', dot: 'bg-rose-500', badge: 'bg-rose-500/15 text-rose-600 dark:text-rose-300 border-rose-500/25' },
      { id: 'sky', dot: 'bg-sky-500', badge: 'bg-sky-500/15 text-sky-600 dark:text-sky-300 border-sky-500/25' },
      { id: 'violet', dot: 'bg-violet-500', badge: 'bg-violet-500/15 text-violet-600 dark:text-violet-300 border-violet-500/25' },
      { id: 'orange', dot: 'bg-orange-500', badge: 'bg-orange-500/15 text-orange-600 dark:text-orange-300 border-orange-500/25' },
      { id: 'teal', dot: 'bg-teal-500', badge: 'bg-teal-500/15 text-teal-600 dark:text-teal-300 border-teal-500/25' }
    ];

    const DEFAULT_COURSES = [
      { id: 'c-finance', name: 'Finance', color: 'emerald' },
      { id: 'c-analytics', name: 'Analytics', color: 'indigo' },
      { id: 'c-accounting', name: 'Accounting', color: 'amber' },
      { id: 'c-clubs', name: 'Clubs', color: 'violet' },
      { id: 'c-personal', name: 'Personal', color: 'sky' }
    ];

    // ---------- App State ----------
    let state = {
      tasks: [],
      courses: [],
      filter: 'active',
      courseFilter: 'all',
      sort: 'dueAsc',
      search: '',
      selectedPriority: 'medium',
      selectedCourseColor: 'indigo',
      expandedNotes: new Set()
    };

    // ---------- Persistence ----------
    function loadState() {
      try {
        const savedTasks = JSON.parse(localStorage.getItem(STORAGE_KEYS.tasks));
        state.tasks = Array.isArray(savedTasks) ? savedTasks : [];
      } catch { state.tasks = []; }

      try {
        const savedCourses = JSON.parse(localStorage.getItem(STORAGE_KEYS.courses));
        state.courses = Array.isArray(savedCourses) && savedCourses.length ? savedCourses : [...DEFAULT_COURSES];
      } catch { state.courses = [...DEFAULT_COURSES]; }

      const savedTheme = localStorage.getItem(STORAGE_KEYS.theme) || 'dark';
      document.documentElement.classList.toggle('dark', savedTheme === 'dark');
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEYS.tasks, JSON.stringify(state.tasks));
    }

    function saveCourses() {
      localStorage.setItem(STORAGE_KEYS.courses, JSON.stringify(state.courses));
    }

    // ---------- Date Utilities (Timezone Safe) ----------
    function getTodayISO() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function parseDueDateTime(dateStr, timeStr) {
      if (!dateStr) return null;
      const [y, m, d] = dateStr.split('-').map(Number);
      if (timeStr) {
        const [hh, mm] = timeStr.split(':').map(Number);
        return new Date(y, m - 1, d, hh, mm, 0, 0);
      }
      return new Date(y, m - 1, d, 23, 59, 59, 999);
    }

    function startOfDay(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    function getDueCategory(task) {
      if (task.completed) return 'completed';
      const now = new Date();
      const due = parseDueDateTime(task.dueDate, task.dueTime);
      if (!due) return 'upcoming';
      if (due < now) return 'overdue';
      const todayStart = startOfDay(now);
      const dueStart = startOfDay(due);
      const diffDays = Math.round((dueStart - todayStart) / 86400000);
      if (diffDays === 0) return 'today';
      return 'upcoming';
    }

    function isWithinNext7Days(task) {
      if (task.completed) return false;
      const now = new Date();
      const due = parseDueDateTime(task.dueDate, task.dueTime);
      if (!due || due < now) return false;
      const diffDays = Math.round((startOfDay(due) - startOfDay(now)) / 86400000);
      return diffDays >= 0 && diffDays <= 7;
    }

    function formatTime12h(timeStr) {
      if (!timeStr) return '11:59 PM';
      const [hh, mm] = timeStr.split(':').map(Number);
      const suffix = hh >= 12 ? 'PM' : 'AM';
      const h12 = hh % 12 || 12;
      return `${h12}:${String(mm).padStart(2, '0')} ${suffix}`;
    }

    function formatDueBadge(task) {
      const due = parseDueDateTime(task.dueDate, task.dueTime);
      if (!due) return { text: 'No due date', cls: 'bg-slate-100 dark:bg-surface-800 text-slate-500' };

      const now = new Date();
      const diffDays = Math.round((startOfDay(due) - startOfDay(now)) / 86400000);
      const dateLabel = due.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      const timeLabel = formatTime12h(task.dueTime);

      if (task.completed) {
        return {
          text: `${dateLabel} • ${timeLabel}`,
          cls: 'bg-slate-100 dark:bg-surface-800 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-white/5'
        };
      }

      if (due < now) {
        const overdueText = diffDays === 0 ? 'Overdue today' : diffDays === -1 ? '1 day overdue' : `${Math.abs(diffDays)} days overdue`;
        return {
          text: `${overdueText} (${dateLabel} • ${timeLabel})`,
          cls: 'bg-rose-500/15 text-rose-600 dark:text-rose-400 border border-rose-500/25'
        };
      }

      if (diffDays === 0) {
        return {
          text: `Due Today (${timeLabel})`,
          cls: 'bg-amber-500/15 text-amber-600 dark:text-amber-300 border border-amber-500/25'
        };
      }

      if (diffDays === 1) {
        return {
          text: `Tomorrow (${dateLabel} • ${timeLabel})`,
          cls: 'bg-indigo-500/15 text-indigo-600 dark:text-indigo-300 border border-indigo-500/25'
        };
      }

      return {
        text: `In ${diffDays} days (${dateLabel} • ${timeLabel})`,
        cls: 'bg-slate-100 dark:bg-surface-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-white/5'
      };
    }

    // ---------- Helpers ----------
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
    }

    function linkifyNotes(text) {
      const escaped = escapeHtml(text);
      return escaped.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer" class="text-indigo-500 dark:text-indigo-400 underline break-all">$1</a>').replace(/\n/g, '<br>');
    }

    function getCourseObj(courseId) {
      return state.courses.find(c => c.id === courseId) || { id: courseId, name: 'General', color: 'indigo' };
    }

    function getPalette(colorId) {
      return COLOR_PALETTE.find(p => p.id === colorId) || COLOR_PALETTE[0];
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.add('hidden'), 2600);
    }

    // ---------- Rendering ----------
    function renderCourseDropdowns() {
      const selects = [document.getElementById('taskCourseInput'), document.getElementById('editCourseInput')];
      selects.forEach(sel => {
        const prev = sel.value;
        sel.innerHTML = state.courses.map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`).join('');
        if (state.courses.some(c => c.id === prev)) sel.value = prev;
      });

      const filterSel = document.getElementById('courseFilterSelect');
      const prevFilter = filterSel.value;
      filterSel.innerHTML = `<option value="all">All Courses</option>` + state.courses.map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`).join('');
      if (prevFilter === 'all' || state.courses.some(c => c.id === prevFilter)) {
        filterSel.value = prevFilter;
      } else {
        filterSel.value = 'all';
        state.courseFilter = 'all';
      }
    }

    function renderPriorityButtons() {
      document.querySelectorAll('.priority-btn').forEach(btn => {
        const p = btn.dataset.priority;
        const active = p === state.selectedPriority;
        btn.className = 'priority-btn py-1.5 rounded-lg text-xs font-medium transition ';
        if (active) {
          if (p === 'low') btn.className += 'bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 font-semibold';
          else if (p === 'medium') btn.className += 'bg-amber-500/20 text-amber-600 dark:text-amber-300 font-semibold';
          else btn.className += 'bg-rose-500/20 text-rose-600 dark:text-rose-400 font-semibold';
        } else {
          btn.className += 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200';
        }
      });
    }

    function renderStatsAndTabs() {
      const counts = { active: 0, today: 0, upcoming: 0, overdue: 0, completed: 0, upcoming7d: 0 };
      state.tasks.forEach(t => {
        const cat = getDueCategory(t);
        if (t.completed) {
          counts.completed++;
        } else {
          counts.active++;
          if (cat === 'today') counts.today++;
          else if (cat === 'overdue') counts.overdue++;
          else counts.upcoming++;
          if (isWithinNext7Days(t)) counts.upcoming7d++;
        }
      });

      document.getElementById('statToday').textContent = counts.today;
      document.getElementById('statUpcoming').textContent = counts.upcoming7d;
      document.getElementById('statOverdue').textContent = counts.overdue;
      document.getElementById('statCompleted').textContent = counts.completed;

      document.querySelectorAll('.filter-tab').forEach(btn => {
        const f = btn.dataset.filter;
        const active = f === state.filter;
        btn.querySelector('.tab-count').textContent = counts[f];
        if (active) {
          btn.className = 'filter-tab px-3.5 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 bg-indigo-600 text-white shadow-md shadow-indigo-600/20';
          btn.querySelector('.tab-count').className = 'tab-count px-1.5 py-0.5 rounded-md text-[10px] bg-white/20 text-white';
        } else {
          btn.className = 'filter-tab px-3.5 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 bg-white dark:bg-surface-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-white/5 hover:border-indigo-500/30';
          btn.querySelector('.tab-count').className = 'tab-count px-1.5 py-0.5 rounded-md text-[10px] bg-slate-100 dark:bg-surface-800 text-slate-500 dark:text-slate-400';
        }
      });
    }

    function renderTasks() {
      renderStatsAndTabs();

      const q = state.search.trim().toLowerCase();
      let filtered = state.tasks.filter(t => {
        const cat = getDueCategory(t);
        if (state.filter === 'active' && t.completed) return false;
        if (state.filter === 'today' && cat !== 'today') return false;
        if (state.filter === 'upcoming' && cat !== 'upcoming') return false;
        if (state.filter === 'overdue' && cat !== 'overdue') return false;
        if (state.filter === 'completed' && !t.completed) return false;
        if (state.courseFilter !== 'all' && t.courseId !== state.courseFilter) return false;
        if (q) {
          const courseName = getCourseObj(t.courseId).name.toLowerCase();
          const haystack = `${t.title} ${t.notes || ''} ${courseName}`.toLowerCase();
          if (!haystack.includes(q)) return false;
        }
        return true;
      });

      const prioRank = { high: 3, medium: 2, low: 1 };
      filtered.sort((a, b) => {
        if (state.sort === 'priorityDesc') {
          const diff = (prioRank[b.priority] || 1) - (prioRank[a.priority] || 1);
          if (diff !== 0) return diff;
        }
        if (state.sort === 'newest') {
          return (b.createdAt || 0) - (a.createdAt || 0);
        }
        const da = parseDueDateTime(a.dueDate, a.dueTime)?.getTime() || Infinity;
        const db = parseDueDateTime(b.dueDate, b.dueTime)?.getTime() || Infinity;
        return da - db;
      });

      const container = document.getElementById('taskList');
      if (!filtered.length) {
        container.innerHTML = `
          <div class="p-10 rounded-2xl bg-white dark:bg-surface-900 border border-dashed border-slate-300 dark:border-white/10 text-center">
            <p class="text-sm font-semibold text-slate-700 dark:text-slate-200">No assignments here</p>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Add a new task above or switch your filter view.</p>
          </div>`;
        return;
      }

      container.innerHTML = filtered.map(task => {
        const course = getCourseObj(task.courseId);
        const palette = getPalette(course.color);
        const badge = formatDueBadge(task);
        const prioDot = task.priority === 'high' ? 'bg-rose-500' : task.priority === 'medium' ? 'bg-amber-500' : 'bg-emerald-500';
        const prioText = task.priority === 'high' ? 'text-rose-500 dark:text-rose-400' : task.priority === 'medium' ? 'text-amber-600 dark:text-amber-400' : 'text-emerald-600 dark:text-emerald-400';
        const prioLabel = task.priority.charAt(0).toUpperCase() + task.priority.slice(1);
        const hasNotes = Boolean(task.notes && task.notes.trim());
        const isExpanded = state.expandedNotes.has(task.id);

        return `
          <article class="task-enter p-4 rounded-2xl bg-white dark:bg-surface-900 border border-slate-200 dark:border-white/5 hover:border-slate-300 dark:hover:border-white/10 transition ${task.completed ? 'opacity-65' : ''}">
            <div class="flex items-start gap-3.5">
              <button type="button" data-toggle-task="${task.id}" aria-label="Toggle completion" class="mt-0.5 w-5 h-5 rounded-md border flex items-center justify-center shrink-0 transition ${task.completed ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 dark:border-slate-600 hover:border-indigo-500'}">
                ${task.completed ? '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>' : ''}
              </button>

              <div class="flex-1 min-w-0">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                  <h3 class="text-sm font-semibold leading-snug break-words ${task.completed ? 'line-through text-slate-400 dark:text-slate-500' : ''}">${escapeHtml(task.title)}</h3>
                  <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-[11px] font-medium shrink-0 self-start sm:self-auto ${badge.cls}">
                    <svg class="w-3 h-3 opacity-80" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25"/></svg>
                    ${escapeHtml(badge.text)}
                  </span>
                </div>

                <div class="mt-2.5 flex flex-wrap items-center justify-between gap-2">
                  <div class="flex flex-wrap items-center gap-2">
                    <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-medium border ${palette.badge}">
                      <span class="w-1.5 h-1.5 rounded-full ${palette.dot}"></span>
                      ${escapeHtml(course.name)}
                    </span>
                    <span class="inline-flex items-center gap-1 text-[11px] font-medium ${prioText}">
                      <span class="w-1.5 h-1.5 rounded-full ${prioDot}"></span>
                      ${prioLabel}
                    </span>
                    ${hasNotes ? `
                      <button type="button" data-expand-notes="${task.id}" class="text-[11px] font-medium text-indigo-600 dark:text-indigo-400 hover:underline">
                        ${isExpanded ? 'Hide notes' : 'View notes'}
                      </button>` : ''}
                  </div>

                  <div class="flex items-center gap-1">
                    <button type="button" data-edit-task="${task.id}" title="Edit task" class="p-1.5 rounded-lg text-slate-400 hover:text-indigo-500 hover:bg-slate-100 dark:hover:bg-surface-800 transition">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931z"/></svg>
                    </button>
                    <button type="button" data-delete-task="${task.id}" title="Delete task" class="p-1.5 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-slate-100 dark:hover:bg-surface-800 transition">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
                    </button>
                  </div>
                </div>

                ${hasNotes && isExpanded ? `
                  <div class="mt-3 p-3 rounded-xl text-xs leading-relaxed bg-slate-50 dark:bg-surface-950 border border-slate-200 dark:border-white/5 text-slate-600 dark:text-slate-300">
                    ${linkifyNotes(task.notes)}
                  </div>` : ''}
              </div>
            </div>
          </article>`;
      }).join('');
    }

    function renderCoursesModal() {
      document.getElementById('courseColorPicker').innerHTML = COLOR_PALETTE.map(p => `
        <button type="button" data-pick-color="${p.id}" class="w-6 h-6 rounded-full ${p.dot} transition ${state.selectedCourseColor === p.id ? 'ring-2 ring-offset-2 ring-indigo-500 dark:ring-offset-surface-900 scale-110' : 'opacity-70 hover:opacity-100'}"></button>
      `).join('');

      document.getElementById('courseList').innerHTML = state.courses.map(c => {
        const pal = getPalette(c.color);
        return `
          <div class="flex items-center justify-between px-3 py-2 rounded-xl bg-slate-50 dark:bg-surface-950 border border-slate-200 dark:border-white/5">
            <div class="flex items-center gap-2.5">
              <span class="w-2.5 h-2.5 rounded-full ${pal.dot}"></span>
              <span class="text-sm font-medium">${escapeHtml(c.name)}</span>
            </div>
            ${state.courses.length > 1 ? `<button type="button" data-remove-course="${c.id}" class="text-xs text-slate-400 hover:text-rose-500 px-2 py-1">Remove</button>` : ''}
          </div>`;
      }).join('');
    }

    // ---------- Modals ----------
    function openModal(id) {
      const m = document.getElementById(id);
      m.classList.remove('hidden');
      m.classList.add('flex');
    }
    function closeModal(id) {
      const m = document.getElementById(id);
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    // ---------- Event Listeners ----------
    document.getElementById('themeToggleBtn').addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem(STORAGE_KEYS.theme, isDark ? 'dark' : 'light');
    });

    document.querySelectorAll('.priority-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.selectedPriority = btn.dataset.priority;
        renderPriorityButtons();
      });
    });

    document.getElementById('toggleNotesBtn').addEventListener('click', () => {
      const drawer = document.getElementById('notesDrawer');
      const chev = document.getElementById('notesChevron');
      drawer.classList.toggle('hidden');
      chev.classList.toggle('rotate-90');
    });

    document.getElementById('addTaskForm').addEventListener('submit', e => {
      e.preventDefault();
      const title = document.getElementById('taskTitleInput').value.trim();
      const dueDate = document.getElementById('taskDateInput').value;
      if (!title || !dueDate) return;

      const newTask = {
        id: 't-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
        title,
        courseId: document.getElementById('taskCourseInput').value,
        dueDate,
        dueTime: document.getElementById('taskTimeInput').value || '',
        priority: state.selectedPriority,
        notes: document.getElementById('taskNotesInput').value.trim(),
        completed: false,
        createdAt: Date.now()
      };

      state.tasks.push(newTask);
      saveTasks();
      renderTasks();

      document.getElementById('taskTitleInput').value = '';
      document.getElementById('taskTimeInput').value = '';
      document.getElementById('taskNotesInput').value = '';
      showToast('Task saved locally');
    });

    document.querySelectorAll('.filter-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        state.filter = btn.dataset.filter;
        renderTasks();
      });
    });

    document.querySelectorAll('[data-stat-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.filter = btn.dataset.statFilter;
        renderTasks();
      });
    });

    document.getElementById('searchInput').addEventListener('input', e => {
      state.search = e.target.value;
      renderTasks();
    });

    document.getElementById('courseFilterSelect').addEventListener('change', e => {
      state.courseFilter = e.target.value;
      renderTasks();
    });

    document.getElementById('sortSelect').addEventListener('change', e => {
      state.sort = e.target.value;
      renderTasks();
    });

    document.getElementById('taskList').addEventListener('click', e => {
      const toggleBtn = e.target.closest('[data-toggle-task]');
      if (toggleBtn) {
        const task = state.tasks.find(t => t.id === toggleBtn.dataset.toggleTask);
        if (task) {
          task.completed = !task.completed;
          saveTasks();
          renderTasks();
        }
        return;
      }

      const expandBtn = e.target.closest('[data-expand-notes]');
      if (expandBtn) {
        const id = expandBtn.dataset.expandNotes;
        if (state.expandedNotes.has(id)) state.expandedNotes.delete(id);
        else state.expandedNotes.add(id);
        renderTasks();
        return;
      }

      const editBtn = e.target.closest('[data-edit-task]');
      if (editBtn) {
        const task = state.tasks.find(t => t.id === editBtn.dataset.editTask);
        if (task) {
          document.getElementById('editTaskId').value = task.id;
          document.getElementById('editTitleInput').value = task.title;
          document.getElementById('editCourseInput').value = task.courseId;
          document.getElementById('editPriorityInput').value = task.priority;
          document.getElementById('editDateInput').value = task.dueDate;
          document.getElementById('editTimeInput').value = task.dueTime || '';
          document.getElementById('editNotesInput').value = task.notes || '';
          openModal('editModal');
        }
        return;
      }

      const delBtn = e.target.closest('[data-delete-task]');
      if (delBtn) {
        state.tasks = state.tasks.filter(t => t.id !== delBtn.dataset.deleteTask);
        saveTasks();
        renderTasks();
        showToast('Task deleted');
      }
    });

    document.getElementById('editTaskForm').addEventListener('submit', e => {
      e.preventDefault();
      const id = document.getElementById('editTaskId').value;
      const task = state.tasks.find(t => t.id === id);
      if (!task) return;
      task.title = document.getElementById('editTitleInput').value.trim();
      task.courseId = document.getElementById('editCourseInput').value;
      task.priority = document.getElementById('editPriorityInput').value;
      task.dueDate = document.getElementById('editDateInput').value;
      task.dueTime = document.getElementById('editTimeInput').value || '';
      task.notes = document.getElementById('editNotesInput').value.trim();
      saveTasks();
      renderTasks();
      closeModal('editModal');
      showToast('Changes saved');
    });

    // Courses Modal
    ['openCoursesBtn', 'quickAddCourseBtn'].forEach(id => {
      document.getElementById(id).addEventListener('click', () => {
        renderCoursesModal();
        openModal('coursesModal');
      });
    });

    document.getElementById('courseColorPicker').addEventListener('click', e => {
      const btn = e.target.closest('[data-pick-color]');
      if (btn) {
        state.selectedCourseColor = btn.dataset.pickColor;
        renderCoursesModal();
      }
    });

    document.getElementById('addCourseForm').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('newCourseNameInput');
      const name = input.value.trim();
      if (!name) return;
      state.courses.push({
        id: 'c-' + Date.now(),
        name,
        color: state.selectedCourseColor
      });
      saveCourses();
      renderCourseDropdowns();
      renderCoursesModal();
      input.value = '';
      showToast(`Added course "${name}"`);
    });

    document.getElementById('courseList').addEventListener('click', e => {
      const btn = e.target.closest('[data-remove-course]');
      if (!btn || state.courses.length <= 1) return;
      state.courses = state.courses.filter(c => c.id !== btn.dataset.removeCourse);
      saveCourses();
      renderCourseDropdowns();
      renderCoursesModal();
      renderTasks();
    });

    // Backup & Restore
    document.getElementById('openBackupBtn').addEventListener('click', () => {
      document.getElementById('importStatus').classList.add('hidden');
      openModal('backupModal');
    });

    document.getElementById('exportJsonBtn').addEventListener('click', () => {
      const payload = {
        app: 'DueFlow',
        exportedAt: new Date().toISOString(),
        courses: state.courses,
        tasks: state.tasks
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `dueflow-backup-${getTodayISO()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup downloaded');
    });

    document.getElementById('importJsonBtn').addEventListener('click', () => {
      document.getElementById('importFileInput').click();
    });

    document.getElementById('importFileInput').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const statusEl = document.getElementById('importStatus');
      const mode = document.querySelector('input[name="importMode"]:checked').value;

      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!Array.isArray(data.tasks)) throw new Error('Missing tasks list');

          if (mode === 'replace') {
            state.tasks = data.tasks;
            if (Array.isArray(data.courses) && data.courses.length) state.courses = data.courses;
          } else {
            const existingTaskIds = new Set(state.tasks.map(t => t.id));
            data.tasks.forEach(t => { if (t && t.id && !existingTaskIds.has(t.id)) state.tasks.push(t); });
            if (Array.isArray(data.courses)) {
              const existingCourseIds = new Set(state.courses.map(c => c.id));
              data.courses.forEach(c => { if (c && c.id && !existingCourseIds.has(c.id)) state.courses.push(c); });
            }
          }

          saveTasks();
          saveCourses();
          renderCourseDropdowns();
          renderTasks();

          statusEl.textContent = `Imported ${data.tasks.length} task(s) successfully.`;
          statusEl.className = 'text-xs text-emerald-600 dark:text-emerald-400';
          showToast('Backup restored');
        } catch {
          statusEl.textContent = 'Invalid backup file. Please select a DueFlow .json file.';
          statusEl.className = 'text-xs text-rose-500';
        }
        e.target.value = '';
      };
      reader.readAsText(file);
    });

    // Close modals on X button, backdrop click, or Escape
    document.querySelectorAll('[data-close-modal]').forEach(btn => {
      btn.addEventListener('click', () => closeModal(btn.dataset.closeModal));
    });
    ['editModal', 'coursesModal', 'backupModal'].forEach(id => {
      document.getElementById(id).addEventListener('click', e => {
        if (e.target.id === id) closeModal(id);
      });
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') ['editModal', 'coursesModal', 'backupModal'].forEach(closeModal);
      if (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
    });

    // ---------- Init ----------
    loadState();
    document.getElementById('taskDateInput').value = getTodayISO();
    renderCourseDropdowns();
    renderPriorityButtons();
    renderTasks();
  </script>
</body>
</html>
